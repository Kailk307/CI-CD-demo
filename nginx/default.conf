server {
    listen 80;
    server_name localhost; # Sau này có tên miền thì thay localhost bằng tên miền

    location / {
        # Điểm mấu chốt: Điều hướng traffic vào container tên là 'app' ở port 3000
        # Trong Docker network, các container gọi nhau bằng TÊN SERVICE được
        proxy_pass http://app:3000; 
        
        # Các cấu hình giúp giữ nguyên thông tin IP gốc của người dùng
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # 2. Điều hướng thêm cho Grafana qua đường dẫn /monitor
    location /monitor/ {
        # Đẩy traffic vào container grafana ở port 3000 (tên service trong docker-compose)
        # CHÚ Ý: Phải có dấu / ở cuối cả cụm url này
        proxy_pass http://grafana:3000/; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


