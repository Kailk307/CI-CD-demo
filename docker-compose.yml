version: '3'

services:
  app:
    image: simple-app
    container_name: kai-app
    ports:
      - "3000:3000"
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80" # Mở cổng mặt tiền 80 cho thế giới đi vào
    volumes:
      # Map file cấu hình từ ngoài Ubuntu vào bên trong container Nginx
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app # Bảo Docker bật con app lên trước rồi mới bật Nginx sau
