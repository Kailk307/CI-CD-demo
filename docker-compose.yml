version: '3'

services:
  app:
    image: simple-app
    container_name: kai-app
    ports:
      - "3000:3000"
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80" # Mở cổng mặt tiền 80 cho thế giới đi vào
    volumes:
      # Map file cấu hình từ ngoài Ubuntu vào bên trong container Nginx
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app # Bảo Docker bật con app lên trước rồi mới bật Nginx sau

  # 1. Bộ thu thập thông tin phần cứng VPS
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # 2. Bộ lưu trữ dữ liệu giám sát
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Mở cổng để check dữ liệu gốc nếu cần
    depends_on:
      - node-exporter

  # 3. Giao diện hiển thị biểu đồ đẹp mắt
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-prod
    # ports:
    environment:
      # Cấu hình "vũ khí bí mật" để Grafana hiểu nó đang chạy dưới path /monitor
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/monitor/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
        # - "30000:3000" # Đổi cổng bên ngoài thành 30000 để tránh trùng với con app (3000)
    depends_on:
      - prometheus
