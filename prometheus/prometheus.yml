global:
  scrape_interval: 15s # Cứ 15 giây đi thu thập dữ liệu một lần

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'vps-hardware-metrics'
    static_configs:
      # node-exporter là tên service chúng ta sẽ định nghĩa trong docker-compose
      - targets: ['node-exporter:9100']
